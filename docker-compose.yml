services:
  otel-lgtm:
    image: grafana/otel-lgtm:latest
    container_name: otel-lgtm
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
      - "9090:9090"
      - "3100:3100"
      - "3200:3200"
      - "3500:3500"
    volumes:
      - lgtm-data:/data
      - ./grafana/provisioning:/otel-lgtm/grafana/conf/provisioning:ro
    environment:
      - TZ=${TZ:-UTC}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_SECURITY_ADMIN_USER=admin
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/otel-lgtm/grafana/conf/provisioning/dashboards/openwrt-overview.json
      - GF_USERS_DEFAULT_THEME=dark
      # NetFlow: the ClickHouse datasource plugin is not bundled in otel-lgtm.
      # This image has no docker-entrypoint.sh, so GF_INSTALL_PLUGINS is NOT
      # honoured; /otel-lgtm/run-grafana.sh explicitly composes with a
      # user-supplied GF_PLUGINS_PREINSTALL, which is what this uses. Grafana
      # downloads the plugin on first start (needs outbound internet) into
      # /data/grafana/plugins, i.e. the lgtm-data volume, so it persists.
      # Harmless when the netflow profile is never enabled.
      - GF_PLUGINS_PREINSTALL=${GRAFANA_PLUGINS_PREINSTALL:-grafana-clickhouse-datasource}
      - ENABLE_LOGS_GRAFANA=true
      - ENABLE_LOGS_LOKI=false
      - ENABLE_LOGS_PROMETHEUS=false
      - ENABLE_LOGS_TEMPO=false
    restart: unless-stopped
  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    ports:
      # Alloy UI (http://localhost:1234), host-loopback only: the UI has no
      # authentication. Matches how openwrt-ssh-mcp is bound below.
      - "127.0.0.1:1234:12345"
      - "${SYSLOG_PORT:-514}:514/udp"  # Syslog receiver UDP
      - "${SYSLOG_PORT:-514}:514/tcp"  # Syslog receiver TCP
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu

        out=/tmp/openwrt-targets.json

        write_target() {
          name=$$1
          address=$$2

          case "$$name" in
            ''|*[!A-Za-z0-9_.-]*)
              echo "Invalid router target name '$$name'. Use only letters, digits, underscore, dot, and hyphen." >&2
              exit 1
              ;;
          esac

          case "$$address" in
            ''|*[!A-Za-z0-9_.:-]*)
              echo "Invalid router target address '$$address'. Use host:port or ip:port." >&2
              exit 1
              ;;
            *:*)
              ;;
            *)
              echo "Invalid router target address '$$address'. Expected host:port or ip:port." >&2
              exit 1
              ;;
          esac

          if [ "$$first" -eq 0 ]; then
            printf ',' >> "$$out"
          fi

          printf '{"targets":["%s"],"labels":{"router":"%s","job":"openwrt"}}' "$$address" "$$name" >> "$$out"
          first=0
        }

        printf '[' > "$$out"
        first=1

        if [ -n "$${ROUTER_TARGETS:-}" ]; then
          case "$$ROUTER_TARGETS" in
            ,*|*,|*,,*)
              echo "Invalid ROUTER_TARGETS '$$ROUTER_TARGETS'. Expected name=ip:port,name=ip:port with no empty entries." >&2
              exit 1
              ;;
          esac

          remaining=$$ROUTER_TARGETS
          while [ -n "$$remaining" ]; do
            case "$$remaining" in
              *,*)
                entry=$${remaining%%,*}
                remaining=$${remaining#*,}
                ;;
              *)
                entry=$$remaining
                remaining=
                ;;
            esac

            case "$$entry" in
              *=*)
                write_target "$${entry%%=*}" "$${entry#*=}"
                ;;
              *)
                echo "Invalid ROUTER_TARGETS entry '$$entry'. Expected name=ip:port." >&2
                exit 1
                ;;
            esac
          done
        else
          write_target "$$ROUTER_NAME" "$$ROUTER_IP:$$ROUTER_METRICS_PORT"
        fi

        printf ']\n' >> "$$out"
        # Both flags must be passed explicitly. Overriding `command:` replaces
        # the image's CMD wholesale, which is where --storage.path=/var/lib/alloy/data
        # comes from; without it Alloy falls back to a cwd-relative data-alloy/
        # and the remote_write WAL is lost on every restart. Alloy's default
        # --server.http.listen-addr is 127.0.0.1:12345, i.e. container-loopback,
        # so the UI port mapping above needs 0.0.0.0 here to be reachable.
        exec /usr/bin/alloy run \
          --server.http.listen-addr=0.0.0.0:12345 \
          --storage.path=/var/lib/alloy/data \
          /etc/alloy/config.alloy
    environment:
      - ROUTER_IP=${ROUTER_IP:-192.168.0.1}
      - ROUTER_NAME=${ROUTER_NAME:-openwrt}
      - ROUTER_TARGETS=${ROUTER_TARGETS:-}
      - ROUTER_METRICS_PORT=${ROUTER_METRICS_PORT:-9100}
      - SCRAPE_INTERVAL=${SCRAPE_INTERVAL:-30s}
    depends_on:
      otel-lgtm:
        condition: service_healthy
    restart: unless-stopped

  openwrt-ssh-mcp:
    profiles: ["mcp"]
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    container_name: openwrt-ssh-mcp
    ports:
      - "127.0.0.1:${OPENWRT_MCP_PORT:-8033}:8033"
    volumes:
      - ./openwrt:/app/openwrt:ro
      # Operator-managed SSH host keys. Create/populate before first use:
      #   ssh-keyscan -H 192.168.0.1 >> known_hosts
      - ${OPENWRT_MCP_KNOWN_HOSTS_FILE:-./known_hosts}:/app/known_hosts:ro
    environment:
      - OPENWRT_MCP_BIND=0.0.0.0
      - OPENWRT_MCP_PORT=8033
      - OPENWRT_MCP_TOKEN=${OPENWRT_MCP_TOKEN:-}
      - OPENWRT_MCP_ROUTERS=${OPENWRT_MCP_ROUTERS:-openwrt-main=192.168.0.1,openwrt-new=192.168.0.2}
      - OPENWRT_MCP_ALLOWED_HOSTS=${OPENWRT_MCP_ALLOWED_HOSTS:-127.0.0.1,localhost}
      - OPENWRT_MCP_ALLOWED_ORIGINS=${OPENWRT_MCP_ALLOWED_ORIGINS:-}
      - OPENWRT_MCP_SSH_TIMEOUT=${OPENWRT_MCP_SSH_TIMEOUT:-15}
      - OPENWRT_MCP_SETUP_TIMEOUT=${OPENWRT_MCP_SETUP_TIMEOUT:-600}
      - OPENWRT_MCP_OUTPUT_LIMIT=${OPENWRT_MCP_OUTPUT_LIMIT:-12000}
      - OPENWRT_MCP_KNOWN_HOSTS=${OPENWRT_MCP_KNOWN_HOSTS:-/app/known_hosts}
      - OPENWRT_MCP_INSECURE_HOST_KEYS=${OPENWRT_MCP_INSECURE_HOST_KEYS:-}
      - OPENWRT_SSH_USERNAME=${OPENWRT_SSH_USERNAME:-}
      - OPENWRT_SSH_PASSWORD=${OPENWRT_SSH_PASSWORD:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8033/healthz', timeout=2).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ── NetFlow / Akvorado ──────────────────────────────────────────────────────
  #
  # Opt-in, exactly like openwrt-ssh-mcp above:
  #
  #   docker compose --profile netflow up -d
  #
  # These services add roughly 4-6 GB of RAM to the stack (Kafka and ClickHouse,
  # not Akvorado itself, which is four small Go processes). They are deliberately
  # NOT part of the default `docker compose up`.
  #
  # No `networks:` block exists in this file, so everything shares the default
  # compose network and resolves by container name. That is how otel-lgtm's
  # Grafana reaches `clickhouse:9000` — do not add a network block, it would
  # rename the existing services' DNS entries.
  #
  # Upstream's Traefik, kafka-ui, geoip-updater and its own Prometheus/Grafana/
  # Loki profiles are intentionally omitted: this repo already has an LGTM stack,
  # and Traefik existed upstream only to multiplex ports we bind directly.

  kafka:
    profiles: ["netflow"]
    image: apache/kafka:4.2.0
    container_name: akvorado-kafka
    environment:
      # KRaft (no Zookeeper). Single-node broker + controller.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: CLIENT://:9092,CONTROLLER://:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CLIENT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: CLIENT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: CLIENT
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--list", "--bootstrap-server", "kafka:9092"]
      interval: 20s
    restart: unless-stopped

  clickhouse:
    profiles: ["netflow"]
    image: clickhouse/clickhouse-server:26.3
    container_name: akvorado-clickhouse
    ports:
      # Loopback only, for `clickhouse-client`/curl debugging. Grafana does not
      # use this — it reaches the native port over the compose network.
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./akvorado/clickhouse/server.xml:/etc/clickhouse-server/config.d/akvorado.xml:ro
      - ./akvorado/clickhouse/observability.xml:/etc/clickhouse-server/config.d/observability.xml:ro
    environment:
      CLICKHOUSE_INIT_TIMEOUT: 60
      CLICKHOUSE_SKIP_USER_SETUP: 1
    cap_add:
      - SYS_NICE
    healthcheck:
      test: ["CMD", "wget", "-T", "1", "--spider", "--no-proxy", "http://127.0.0.1:8123/ping"]
      interval: 20s
    stop_grace_period: 30s
    restart: unless-stopped

  redis:
    profiles: ["netflow"]
    image: valkey/valkey:9.0
    container_name: akvorado-redis
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 redis-cli ping | grep -q PONG"]
      interval: 20s
    restart: unless-stopped

  akvorado-orchestrator:
    profiles: ["netflow"]
    image: quay.io/akvorado/akvorado:2.4.1
    container_name: akvorado-orchestrator
    command: orchestrator /etc/akvorado/akvorado.yaml
    volumes:
      # The whole directory, not individual files: akvorado.yaml pulls in
      # exporters.yaml via !include, and that file is operator-created (see
      # akvorado/exporters.yaml.example). A missing include fails startup
      # loudly, which is the intent — a wrong ifIndex silently discards every
      # flow, so no default is better than a plausible guess.
      - ./akvorado:/etc/akvorado:ro
      # Akvorado watches the GeoIP database directory even when GeoIP is marked
      # optional. Keep an empty directory mounted so the orchestrator can start
      # without MaxMind/IPinfo databases; drop country.mmdb/asn.mmdb here later
      # if GeoIP enrichment is enabled.
      - ./akvorado/geoip:/usr/share/GeoIP:ro
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy

  akvorado-inlet:
    profiles: ["netflow"]
    image: quay.io/akvorado/akvorado:2.4.1
    container_name: akvorado-inlet
    command: inlet http://akvorado-orchestrator:8080
    ports:
      # Bound on all interfaces, unlike everything else here: the routers have
      # to reach these. NetFlow v5/v9 on 2055, IPFIX on 4739, sFlow on 6343.
      - "${NETFLOW_PORT:-2055}:2055/udp"
      - "${IPFIX_PORT:-4739}:4739/udp"
      - "${SFLOW_PORT:-6343}:6343/udp"
    volumes:
      - akvorado-run:/run/akvorado
    restart: unless-stopped
    depends_on:
      akvorado-orchestrator:
        condition: service_healthy
      kafka:
        condition: service_healthy

  akvorado-outlet:
    profiles: ["netflow"]
    image: quay.io/akvorado/akvorado:2.4.1
    container_name: akvorado-outlet
    command: outlet http://akvorado-orchestrator:8080
    volumes:
      - akvorado-run:/run/akvorado
    environment:
      AKVORADO_CFG_OUTLET_METADATA_CACHEPERSISTFILE: /run/akvorado/metadata.cache
      AKVORADO_CFG_OUTLET_FLOW_STATEPERSISTFILE: /run/akvorado/flow.state
    stop_grace_period: 30s
    restart: unless-stopped
    depends_on:
      akvorado-orchestrator:
        condition: service_healthy
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  akvorado-console:
    profiles: ["netflow"]
    image: quay.io/akvorado/akvorado:2.4.1
    container_name: akvorado-console
    command: console http://akvorado-orchestrator:8080
    ports:
      # Loopback only. Upstream fronts this with Traefik and injects a
      # Remote-User header; bound here directly, so it is unauthenticated and
      # must not be exposed beyond the host. Same posture as the Alloy UI above.
      - "127.0.0.1:${AKVORADO_CONSOLE_PORT:-8081}:8080"
    volumes:
      - akvorado-console-db:/run/akvorado
    environment:
      AKVORADO_CFG_CONSOLE_DATABASE_DSN: /run/akvorado/console.sqlite
    restart: unless-stopped
    depends_on:
      akvorado-orchestrator:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

volumes:
  lgtm-data:
    driver: local
  # Persists the prometheus.remote_write WAL across container recreation.
  alloy-data:
    driver: local
  # NetFlow profile only. These stay on disk when the profile is down; remove
  # them with `docker compose --profile netflow down -v` if you abandon it.
  # clickhouse-data is the one that grows — see docs/netflow-akvorado.md for
  # the retention settings that bound it.
  clickhouse-data:
    driver: local
  kafka-data:
    driver: local
  # inlet/outlet scratch state: metadata cache and flow decoder state.
  akvorado-run:
    driver: local
  # Console SQLite: saved filters and users.
  akvorado-console-db:
    driver: local
